<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2456.00 2142.00" role="img" aria-labelledby="title">
  <title id="title">Sheaf stacked lockup</title>
  <!--
    Sheaf stacked lockup, final master. Symbol above Sheaf, both
    centred on one axis.
    Symbol ink width 0.50x the wordmark ink width (2396.00), so
    symbol scale 6.1122x of its 256 box; symbol ink 1198.00 x 1271.71.
    Vertical gap 105.60 = 0.15x wordmark ink height, measured
    ink-to-ink between the symbol's bottom edge and the wordmark's top.
    Canvas framed to the ink plus the 30 pad, uniform on all four
    sides. Framing to the symbol's box surfaced its 22.94-unit headroom    as 140.89 of top margin against a 30 pad and skewed the aspect.
    Symbol placed from its ink extent, not its 256 box: the tie band
    overhangs the S by ~30 box units on each side.
    Weight imbalance is deliberate: the symbol stroke 220.0 is 2.46x the
    wordmark stem (89.3, 0.173 x x-height). Forcing weight parity
    here would make the mark a footnote above a wide word.
    Composition 1.147:1 wide; near-square, for badges and signs.
    Symbol paths are nested, not flattened: brand/final/sheaf-symbol.svg
    is re-cut independently and the lockup inherits the change.
    No <text>, no font-family, no strokes, no gradients.
  -->
